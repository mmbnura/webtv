<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Indian TV Channels</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

h2 {
  margin: 12px;
  border-left: 6px solid orange;
  padding-left: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  padding: 10px;
}

.tile {
  background: #1c1c1c;
  padding: 14px;
  text-align: center;
  border-radius: 6px;
  cursor: pointer;
  outline: none;
}

.tile:focus {
  border: 3px solid orange;
}
</style>
</head>

<body>

<h2>Tamil Channels</h2>
<div id="tamil" class="grid">Loading…</div>

<h2>Hindi Channels</h2>
<div id="hindi" class="grid">Loading…</div>

<h2>English Channels</h2>
<div id="english" class="grid">Loading…</div>

<script>

  .then(r => r.json())

    const hindi = document.getElementById("hindi");
    const english = document.getElementById("english");

    hindi.innerHTML = "";
    english.innerHTML = "";

      if (c.country !== "IN") return;

      const langs = (c.languages || []).join(" ").toLowerCase();

      tile.tabIndex = 0;
      tile.textContent = c.name;

        langs.includes("tam") ||
        name.includes("tamil") ||
        name.includes("sun")
      ) {
        tamil.appendChild(tile);
      }
