<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Indian TV Channels</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

h2 {
  margin: 12px;
  border-left: 6px solid orange;
  padding-left: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  padding: 10px;
}

.tile {
  background: #1c1c1c;
  padding: 14px;
  text-align: center;
  border-radius: 6px;
  cursor: pointer;
  outline: none;
}

.tile:focus {
  border: 3px solid orange;
}
</style>
</head>

<body>

<h2>Tamil Channels</h2>
<div id="tamil" class="grid"></div>

<h2>Hindi Channels</h2>
<div id="hindi" class="grid"></div>

<h2>English Channels</h2>
<div id="english" class="grid"></div>

<div id="status" style="padding:12px">Loading Indian channels…</div>

<script>
const tamilKeywords = [
  "sun", "vijay", "k tv", "zee tamil", "polimer",
  "kalaignar", "raj", "jaya", "thanthi",
  "news7 tamil", "puthiya thalaimurai",
  "colors tamil", "chutti"
];

const hindiKeywords = [
  "zee", "sony", "sab", "star",
  "colors", "aaj tak", "ndtv",
  "dd national", "dd news",
  "mtv", "india tv"
];

const englishKeywords = [
  "cnn", "bbc", "discovery",
  "national geographic", "nat geo",
  "hbo", "movies now",
  "cnbc", "bloomberg",
  "star world", "india today"
];

fetch("https://iptv-org.github.io/api/channels.json")
  .then(r => r.json())
  .then(channels => {
    const tamil = document.getElementById("tamil");
    const hindi = document.getElementById("hindi");
    const english = document.getElementById("english");
    const status = document.getElementById("status");

    let total = 0;

    channels.forEach(c => {
      if (c.country !== "IN") return;

      const name = c.name.toLowerCase();
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.tabIndex = 0;
      tile.textContent = c.name;

      if (tamilKeywords.some(k => name.includes(k))) {
        tamil.appendChild(tile);
        total++;
      }
      else if (hindiKeywords.some(k => name.includes(k))) {
        hindi.appendChild(tile);
        total++;
      }
      else if (englishKeywords.some(k => name.includes(k))) {
        english.appendChild(tile);
        total++;
      }
    });

    status.textContent = "Displayed channels: " + total;

    const first = document.querySelector(".tile");
    if (first) first.focus();
  })
  .catch(err => {
    document.getElementById("status").textContent = "Error loading channels";
    console.error(err);
  });
</script>

</body>
</html>
