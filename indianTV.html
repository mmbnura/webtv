<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Indian TV Channels</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

#status {
  padding: 20px;
  font-size: 18px;
}

h2 {
  margin: 12px;
  border-left: 6px solid orange;
  padding-left: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  padding: 10px;
}

.tile {
  background: #1c1c1c;
  padding: 15px;
  text-align: center;
  border-radius: 6px;
  cursor: pointer;
  outline: none;
}

.tile:focus {
  border: 3px solid orange;
}

video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  background: black;
  z-index: 999;
}
</style>
</head>

<body>

<div id="status">Loading Indian TV channels…</div>
<div id="content"></div>

<video id="video" controls></video>

<script>
const CHANNELS_URL = "https://iptv-org.github.io/api/channels.json";
const STREAMS_URL  = "https://iptv-org.github.io/api/streams.json";

const status = document.getElementById("status");
const content = document.getElementById("content");
const video = document.getElementById("video");

let hls;

Promise.all([
  fetch(CHANNELS_URL).then(r => r.json()),
  fetch(STREAMS_URL).then(r => r.json())
]).then(([channels, streams]) => {
  buildUI(channels, streams);
}).catch(err => {
  console.error(err);
  status.textContent = "Failed to load IPTV data";
});

function buildUI(channels, streams) {
  // Map channelId -> HLS stream URL
  const streamMap = {};
  streams.forEach(s => {
    if (
      s.channel &&
      s.url &&
      s.url.includes(".m3u8") &&
      !streamMap[s.channel]
    ) {
      streamMap[s.channel] = s.url;
    }
  });

  const tamil = [];
  const hindi = [];
  const english = [];

  channels.forEach(c => {
    if (c.country !== "IN") return;
    const url = streamMap[c.id];
    if (!url) return;

    const name = c.name.toLowerCase();
    const langs = (c.languages || []).join(" ").toLowerCase();

    const channel = { name: c.name, url };

    if (
      langs.includes("tam") ||
      name.includes("tamil") ||
      name.includes("sun")
    ) {
      tamil.push(channel);
    } else if (
      langs.includes("hin") ||
      name.includes("zee") ||
      name.includes("sony")
    ) {
      hindi.push(channel);
    } else {
      english.push(channel);
    }
  });

  status.remove();

  renderSection("Tamil Channels", tamil);
  renderSection("Hindi Channels", hindi);
  renderSection("English Channels", english);

  const first = document.querySelector(".tile");
  if (first) first.focus();
}

function renderSection(title, list) {
  if (!list.length) return;

  const h = document.createElement("h2");
  h.textContent = title;

  const grid = document.createElement("div");
  grid.className = "grid";

  list.forEach(c => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.tabIndex = 0;
    tile.textContent = c.name;

    tile.onclick = () => play(c.url);
    tile.onkeydown = e => e.key === "Enter" && play(c.url);

    grid.appendChild(tile);
  });

  content.appendChild(h);
  content.appendChild(grid);
}

function play(url) {
  video.style.display = "block";

  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }

  video.play();
  video.requestFullscreen?.();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" || e.key === "Backspace") {
    video.pause();
    video.style.display = "none";
    document.exitFullscreen?.();
  }
});
</script>

</body>
</html>
