<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPTV Web Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  display: flex;
  height: 100vh;
}

/* Sidebar */
#sidebar {
  width: 35%;
  padding: 10px;
  overflow-y: auto;
  border-right: 2px solid #333;
}

/* Controls */
input, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  font-size: 16px;
  border-radius: 4px;
  border: none;
}

/* Channel list */
.channel {
  padding: 12px;
  border-bottom: 1px solid #333;
  cursor: pointer;
}

.channel:hover {
  background: #222;
}

/* Player */
#player {
  width: 65%;
  padding: 10px;
}

video {
  width: 100%;
  height: calc(100% - 10px);
  background: black;
}
</style>
</head>

<body>

<div id="sidebar">
  <input type="text" id="search" placeholder="Search channel..." />
  <select id="countryFilter">
    <option value="">All Countries</option>
  </select>

  <div id="channels">Loading channels...</div>
</div>

<div id="player">
  <video id="video" controls autoplay></video>
</div>

<script>
const PLAYLIST_URL = "https://iptv-org.github.io/iptv/index.m3u";

const channelsDiv = document.getElementById("channels");
const searchInput = document.getElementById("search");
const countrySelect = document.getElementById("countryFilter");
const video = document.getElementById("video");

let channels = [];
let hls;

fetch(PLAYLIST_URL)
  .then(res => res.text())
  .then(text => parseM3U(text))
  .catch(() => channelsDiv.innerHTML = "Failed to load playlist");

function parseM3U(data) {
  const lines = data.split("\n");
  let name = "", country = "", url = "";

  channels = [];

  lines.forEach(line => {
    line = line.trim();

    if (line.startsWith("#EXTINF")) {
      name = line.split(",").pop();
      const match = line.match(/country="([^"]+)"/);
      country = match ? match[1] : "Unknown";
    } 
    else if (line.startsWith("http") && line.includes(".m3u8")) {
      url = line;
      channels.push({ name, country, url });
    }
  });

  populateCountries();
  renderChannels();
}

function populateCountries() {
  const countries = [...new Set(channels.map(c => c.country))].sort();
  countries.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    countrySelect.appendChild(opt);
  });
}

function renderChannels() {
  const search = searchInput.value.toLowerCase();
  const country = countrySelect.value;

  channelsDiv.innerHTML = "";

  channels
    .filter(c =>
      c.name.toLowerCase().includes(search) &&
      (country === "" || c.country === country)
    )
    .forEach(c => {
      const div = document.createElement("div");
      div.className = "channel";
      div.textContent = `${c.name} (${c.country})`;
      div.onclick = () => play(c.url);
      channelsDiv.appendChild(div);
    });
}

function play(url) {
  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls({ lowLatencyMode: true });
    hls.loadSource(url);
    hls.attachMedia(video);
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
  } else {
    alert("Stream not supported on this browser");
  }
}

searchInput.addEventListener("input", renderChannels);
countrySelect.addEventListener("change", renderChannels);
</script>

</body>
</html>
