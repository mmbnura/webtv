<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMB Player - IPTV</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="logo-section">
            <div class="logo-icon">▶</div>
            <div class="logo-text">
                <h1>MMB Player</h1>
                <span class="tagline">Live TV Streaming</span>
            </div>
        </div>
        <div class="header-stats">
            <div class="stat-item">
                <span class="stat-value" id="channelCount">0</span>
                <span class="stat-label">Channels</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="categoryCount">0</span>
                <span class="stat-label">Categories</span>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Categories Panel -->
        <div class="panel categories-panel">
            <div class="panel-header">
                <span>📂 Categories</span>
            </div>
            <div class="panel-content" id="categoriesList">
                <div class="category-item active" data-category="favorites">
                    <span class="category-icon">⭐</span>
                    <span class="category-name">Favorites</span>
                </div>
                <!-- Categories will be populated here -->
            </div>
        </div>

        <!-- Channels Panel -->
        <div class="panel channels-panel">
            <div class="panel-header">
                <span id="channelsPanelTitle">📺 Channels</span>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 Search channels..." />
            </div>
            <div class="panel-content" id="channelsList">
                <!-- Channels will be populated here -->
            </div>
        </div>

        <!-- Player Panel -->
        <div class="panel player-panel">
            <div class="player-container">
                <video id="videoPlayer" controls></video>
                <div class="player-overlay" id="playerOverlay">
                    <div class="overlay-content">
                        <div class="player-icon">▶</div>
                        <div class="player-message">Select a channel to start playing</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-left" id="nowPlaying">
            <span class="status-icon">📡</span>
            <span>Now Playing: None</span>
        </div>
        <div class="status-center" id="qualityInfo">
            <span class="quality-badge">Auto</span>
            <span class="quality-separator">·</span>
            <span class="resolution">-</span>
        </div>
        <div class="status-right">
            <button id="qualitySelector" class="quality-btn">
                <span class="btn-icon">⚙</span>
                <span>Quality</span>
            </button>
        </div>
    </div>

    <!-- Quality Selection Modal -->
    <div class="modal" id="qualityModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙ Select Quality</h3>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="qualityOptions">
                <!-- Quality options will be populated here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
