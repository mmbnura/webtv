<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MMB Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* ===== TOP BAR ===== */
#topbar {
  height: 60px;
  background: linear-gradient(90deg, #111, #1a1a1a);
  display: flex;
  align-items: center;
  padding: 0 20px;
  justify-content: space-between;
}

#logo {
  font-size: 24px;
  font-weight: bold;
  color: #ff3b3b;
}

/* ===== MAIN LAYOUT ===== */
#main {
  display: grid;
  grid-template-columns: 260px 360px 1fr;
  height: calc(100vh - 60px);
}

/* ===== CATEGORIES ===== */
#categories {
  background: #121217;
  overflow-y: auto;
}

.category {
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 1px solid #1f1f1f;
}

.category:focus,
.category.active {
  background: #ff3b3b;
  color: #000;
  outline: none;
}

/* ===== CHANNELS ===== */
#channels {
  background: #14141a;
  overflow-y: auto;
}

.channel {
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid #1f1f1f;
}

.channel:focus,
.channel.active {
  background: #2a2a35;
  outline: none;
}

/* ===== PLAYER ===== */
#player {
  background: #000;
  padding: 12px;
  display: flex;
  flex-direction: column;
}

#videoBox {
  flex: 1;
  border: 2px solid #1f1f1f;
  position: relative;
}

video {
  width: 100%;
  height: 100%;
  background: black;
}

#nowPlaying {
  padding: 8px;
  font-size: 14px;
  background: #111;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #444; }
</style>
</head>

<body>

<div id="topbar">
  <div id="logo">MMB Player</div>
  <div>Live Channels TV</div>
</div>

<div id="main">

  <div id="categories"></div>
  <div id="channels"></div>

  <div id="player">
    <div id="videoBox">
      <video id="video" controls></video>
    </div>
    <div id="nowPlaying">Select a channel</div>
  </div>

</div>

<script>
const CHANNELS_URL = "https://iptv-org.github.io/api/channels.json";
const STREAMS_URL  = "https://iptv-org.github.io/api/streams.json";

const categoriesDiv = document.getElementById("categories");
const channelsDiv = document.getElementById("channels");
const video = document.getElementById("video");
const nowPlaying = document.getElementById("nowPlaying");

let hls;
let isFullscreen = false;

/* ===== LOAD IPTV DATA ===== */
Promise.all([
  fetch(CHANNELS_URL).then(r => r.json()),
  fetch(STREAMS_URL).then(r => r.json())
]).then(([channels, streams]) => init(channels, streams));

function init(channels, streams) {

  /* Build channelId → stream map */
  const streamMap = {};
  streams.forEach(s => {
    if (s.channel && s.url && s.url.includes(".m3u8") && !streamMap[s.channel]) {
      streamMap[s.channel] = s.url;
    }
  });

  /* Build categories dynamically */
  const categoryMap = {};

  channels.forEach(c => {
    const url = streamMap[c.id];
    if (!url) return;

    const category = (c.categories && c.categories.length)
      ? c.categories[0]
      : "Other";

    if (!categoryMap[category]) categoryMap[category] = [];

    categoryMap[category].push({
      name: c.name,
      url
    });
  });

  renderCategories(categoryMap);
}

/* ===== RENDER CATEGORIES ===== */
function renderCategories(map) {
  categoriesDiv.innerHTML = "";
  Object.keys(map).forEach((cat, i) => {
    const div = document.createElement("div");
    div.className = "category";
    div.tabIndex = 0;
    div.textContent = cat;

    div.onclick = () => loadChannels(cat, map);
    div.onkeydown = e => e.key === "Enter" && loadChannels(cat, map);

    categoriesDiv.appendChild(div);

    if (i === 0) loadChannels(cat, map, div);
  });
}

/* ===== LOAD CHANNELS ===== */
function loadChannels(cat, map, el) {
  document.querySelectorAll(".category").forEach(c => c.classList.remove("active"));
  if (el) el.classList.add("active");

  channelsDiv.innerHTML = "";

  map[cat].forEach(ch => {
    const div = document.createElement("div");
    div.className = "channel";
    div.tabIndex = 0;
    div.textContent = ch.name;

    div.onclick = () => play(ch, div);
    div.onkeydown = e => e.key === "Enter" && play(ch, div);

    channelsDiv.appendChild(div);
  });

  const first = channelsDiv.querySelector(".channel");
  if (first) first.focus();
}

/* ===== PLAY CHANNEL ===== */
function play(ch, el) {
  document.querySelectorAll(".channel").forEach(c => c.classList.remove("active"));
  el.classList.add("active");

  nowPlaying.textContent = "Now Playing: " + ch.name;

  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
  } else {
    video.src = ch.url;
  }

  video.play();
}

/* ===== CLICK VIDEO → FULLSCREEN TOGGLE ===== */
video.addEventListener("click", () => {
  if (!isFullscreen) {
    video.requestFullscreen?.();
    isFullscreen = true;
  } else {
    document.exitFullscreen?.();
    isFullscreen = false;
  }
});

/* ===== BACK / ESC HANDLING ===== */
document.addEventListener("keydown", e => {
  if (isFullscreen && (e.key === "Escape" || e.key === "Backspace")) {
    e.preventDefault();
    document.exitFullscreen?.();
    isFullscreen = false;
  }
});
</script>

</body>
</html>
