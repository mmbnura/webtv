<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MMB Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* ===== TOP BAR ===== */
#topbar {
  height: 60px;
  background: linear-gradient(90deg, #111, #1a1a1a);
  display: flex;
  align-items: center;
  padding: 0 20px;
  justify-content: space-between;
}

#logo {
  font-size: 24px;
  font-weight: bold;
  color: #ff3b3b;
}

/* ===== MAIN LAYOUT ===== */
#main {
  display: grid;
  grid-template-columns: 280px 380px 1fr;
  height: calc(100vh - 60px);
}

/* ===== CATEGORIES ===== */
#categories {
  background: #121217;
  overflow-y: auto;
  border-right: 1px solid #222;
}

.category {
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 1px solid #1f1f1f;
}

.category:focus,
.category.active {
  background: #ff3b3b;
  color: #000;
  outline: none;
}

/* ===== SEARCH ===== */
#searchBox {
  width: calc(100% - 24px);
  margin: 12px;
  padding: 10px;
  font-size: 16px;
  border-radius: 4px;
  border: none;
  outline: none;
}

/* ===== CHANNELS ===== */
#channels {
  background: #14141a;
  overflow-y: auto;
  border-right: 1px solid #222;
}

.channel {
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid #1f1f1f;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.channel:focus,
.channel.active {
  background: #2a2a35;
  outline: none;
}

.star {
  font-size: 18px;
  cursor: pointer;
  color: #777;
}

.star.fav {
  color: gold;
}

/* ===== PLAYER ===== */
#player {
  background: #000;
  padding: 12px;
  display: flex;
  flex-direction: column;
}

#videoBox {
  flex: 1;
  border: 2px solid #1f1f1f;
}

video {
  width: 100%;
  height: 100%;
  background: black;
}

#nowPlaying {
  padding: 8px;
  font-size: 14px;
  background: #111;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #444; }
</style>
</head>

<body>

<div id="topbar">
  <div id="logo">MMB Player</div>
  <div>Live Channels TV</div>
</div>

<div id="main">

  <!-- Categories -->
  <div id="categories">
    <input id="searchBox" type="text" placeholder="Search channel & press OK" />
    <div id="favCategory" class="category">⭐ Favorites</div>
  </div>

  <!-- Channels -->
  <div id="channels"></div>

  <!-- Player -->
  <div id="player">
    <div id="videoBox">
      <video id="video" controls></video>
    </div>
    <div id="nowPlaying">Select a channel</div>
  </div>

</div>

<script>
const CHANNELS_URL = "https://iptv-org.github.io/api/channels.json";
const STREAMS_URL  = "https://iptv-org.github.io/api/streams.json";

const categoriesDiv = document.getElementById("categories");
const channelsDiv = document.getElementById("channels");
const video = document.getElementById("video");
const nowPlaying = document.getElementById("nowPlaying");
const searchBox = document.getElementById("searchBox");
const favCategory = document.getElementById("favCategory");

let hls;
let isFullscreen = false;
let categoryMap = {};
let allChannels = [];
let favorites = JSON.parse(localStorage.getItem("mmb_favorites") || "{}");

/* ===== LOAD IPTV DATA ===== */
Promise.all([
  fetch(CHANNELS_URL).then(r => r.json()),
  fetch(STREAMS_URL).then(r => r.json())
]).then(([channels, streams]) => init(channels, streams));

function init(channels, streams) {
  const streamMap = {};

  streams.forEach(s => {
    if (s.channel && s.url && s.url.includes(".m3u8") && !streamMap[s.channel]) {
      streamMap[s.channel] = s.url;
    }
  });

  channels.forEach(c => {
    const url = streamMap[c.id];
    if (!url) return;

    const cat = (c.categories && c.categories.length)
      ? c.categories[0]
      : "Other";

    if (!categoryMap[cat]) categoryMap[cat] = [];

    const ch = { id: c.id, name: c.name, url };
    categoryMap[cat].push(ch);
    allChannels.push(ch);
  });

  renderCategories();
}

/* ===== RENDER CATEGORIES ===== */
function renderCategories() {
  Object.keys(categoryMap).forEach((cat, i) => {
    const div = document.createElement("div");
    div.className = "category";
    div.tabIndex = 0;
    div.textContent = cat;

    div.onclick = () => loadChannels(categoryMap[cat], div);
    div.onkeydown = e => e.key === "Enter" && loadChannels(categoryMap[cat], div);

    categoriesDiv.appendChild(div);
    if (i === 0) loadChannels(categoryMap[cat], div);
  });
}

/* ===== LOAD CHANNEL LIST ===== */
function loadChannels(list, el) {
  document.querySelectorAll(".category").forEach(c => c.classList.remove("active"));
  if (el) el.classList.add("active");

  channelsDiv.innerHTML = "";

  list.forEach(ch => {
    const row = document.createElement("div");
    row.className = "channel";
    row.tabIndex = 0;

    const name = document.createElement("span");
    name.textContent = ch.name;

    const star = document.createElement("span");
    star.className = "star" + (favorites[ch.id] ? " fav" : "");
    star.textContent = "★";

    star.onclick = e => {
      e.stopPropagation();
      toggleFavorite(ch, star);
    };

    row.onclick = () => play(ch, row);
    row.onkeydown = e => e.key === "Enter" && play(ch, row);

    row.appendChild(name);
    row.appendChild(star);
    channelsDiv.appendChild(row);
  });

  const first = channelsDiv.querySelector(".channel");
  if (first) first.focus();
}

/* ===== FAVORITES ===== */
function toggleFavorite(ch, starEl) {
  if (favorites[ch.id]) {
    delete favorites[ch.id];
    starEl.classList.remove("fav");
  } else {
    favorites[ch.id] = ch;
    starEl.classList.add("fav");
  }
  localStorage.setItem("mmb_favorites", JSON.stringify(favorites));
}

favCategory.onclick = () => {
  loadChannels(Object.values(favorites), favCategory);
};

/* ===== SEARCH (ENTER ONLY) ===== */
searchBox.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;

  const q = searchBox.value.toLowerCase().trim();
  if (!q) return;

  const results = allChannels.filter(c =>
    c.name.toLowerCase().includes(q)
  );

  loadChannels(results);
});

/* ===== PLAY ===== */
function play(ch, el) {
  document.querySelectorAll(".channel").forEach(c => c.classList.remove("active"));
  el.classList.add("active");

  nowPlaying.textContent = "Now Playing: " + ch.name;

  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
  } else {
    video.src = ch.url;
  }

  video.play();
}

/* ===== FULLSCREEN TOGGLE ===== */
video.addEventListener("click", () => {
  if (!isFullscreen) {
    video.requestFullscreen?.();
    isFullscreen = true;
  } else {
    document.exitFullscreen?.();
    isFullscreen = false;
  }
});

/* ===== BACK / ESC ===== */
document.addEventListener("keydown", e => {
  if (isFullscreen && (e.key === "Escape" || e.key === "Backspace")) {
    e.preventDefault();
    document.exitFullscreen?.();
    isFullscreen = false;
  }
});
</script>

</body>
</html>
