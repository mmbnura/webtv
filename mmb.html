<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MMB Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  color: #fff;
  font-family: Arial, sans-serif;
}

/* ===== TOP BAR ===== */
#topbar {
  height: 60px;
  background: linear-gradient(90deg, #111, #1a1a1a);
  display: flex;
  align-items: center;
  padding: 0 20px;
  justify-content: space-between;
}

#logo {
  font-size: 24px;
  font-weight: bold;
  color: #ff3b3b;
}

#clock {
  font-size: 14px;
  opacity: 0.8;
}

/* ===== MAIN LAYOUT ===== */
#main {
  display: grid;
  grid-template-columns: 260px 360px 1fr;
  height: calc(100vh - 60px);
}

/* ===== CATEGORIES ===== */
#categories {
  background: #121217;
  border-right: 1px solid #222;
  overflow-y: auto;
}

.category {
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 1px solid #1f1f1f;
}

.category:focus,
.category.active {
  background: #ff3b3b;
  color: #000;
  outline: none;
}

/* ===== CHANNEL LIST ===== */
#channels {
  background: #14141a;
  border-right: 1px solid #222;
  overflow-y: auto;
}

.channel {
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid #1f1f1f;
  display: flex;
  align-items: center;
  gap: 10px;
}

.channel:focus,
.channel.active {
  background: #2a2a35;
  outline: none;
}

/* ===== PLAYER ===== */
#player {
  background: #000;
  padding: 15px;
  display: flex;
  flex-direction: column;
}

#videoBox {
  background: #000;
  flex: 1;
  border: 2px solid #1f1f1f;
}

video {
  width: 100%;
  height: 100%;
  background: black;
}

#nowPlaying {
  padding: 10px;
  font-size: 14px;
  background: #111;
  border-top: 1px solid #222;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-thumb {
  background: #444;
}
</style>
</head>

<body>

<!-- ===== TOP BAR ===== -->
<div id="topbar">
  <div id="logo">MMB Player</div>
  <div id="clock"></div>
</div>

<!-- ===== MAIN ===== -->
<div id="main">

  <!-- Categories -->
  <div id="categories"></div>

  <!-- Channels -->
  <div id="channels"></div>

  <!-- Player -->
  <div id="player">
    <div id="videoBox">
      <video id="video" controls></video>
    </div>
    <div id="nowPlaying">Select a channel</div>
  </div>

</div>

<script>
/* ===== CLOCK ===== */
setInterval(() => {
  const d = new Date();
  document.getElementById("clock").textContent =
    d.toLocaleTimeString() + " | " + d.toDateString();
}, 1000);

/* ===== DEMO DATA (replace later with IPTV logic) ===== */
const data = {
  "All": [
    { name: "DD News", url: "" },
    { name: "Sun TV", url: "" },
    { name: "Zee TV", url: "" }
  ],
  "Tamil": [
    { name: "Sun TV", url: "" },
    { name: "Vijay TV", url: "" }
  ],
  "Hindi": [
    { name: "Zee TV", url: "" },
    { name: "Sony TV", url: "" }
  ],
  "English": [
    { name: "CNN", url: "" },
    { name: "BBC World", url: "" }
  ]
};

const categoriesDiv = document.getElementById("categories");
const channelsDiv = document.getElementById("channels");
const video = document.getElementById("video");
const nowPlaying = document.getElementById("nowPlaying");

let hls;

/* ===== LOAD CATEGORIES ===== */
Object.keys(data).forEach((cat, idx) => {
  const div = document.createElement("div");
  div.className = "category";
  div.tabIndex = 0;
  div.textContent = cat;

  div.onclick = () => loadChannels(cat, div);
  div.onkeydown = e => e.key === "Enter" && loadChannels(cat, div);

  categoriesDiv.appendChild(div);
  if (idx === 0) loadChannels(cat, div);
});

/* ===== LOAD CHANNELS ===== */
function loadChannels(category, el) {
  document.querySelectorAll(".category").forEach(c => c.classList.remove("active"));
  el.classList.add("active");

  channelsDiv.innerHTML = "";

  data[category].forEach(ch => {
    const div = document.createElement("div");
    div.className = "channel";
    div.tabIndex = 0;
    div.textContent = ch.name;

    div.onclick = () => playChannel(ch);
    div.onkeydown = e => e.key === "Enter" && playChannel(ch);

    channelsDiv.appendChild(div);
  });
}

/* ===== PLAY CHANNEL ===== */
function playChannel(ch) {
  document.querySelectorAll(".channel").forEach(c => c.classList.remove("active"));
  event.target.classList.add("active");

  nowPlaying.textContent = "Now Playing: " + ch.name;

  if (!ch.url) {
    video.pause();
    video.removeAttribute("src");
    return;
  }

  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
  } else {
    video.src = ch.url;
  }

  video.play();
}
</script>

</body>
</html>
