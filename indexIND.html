<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Indian TV Channels</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

h2 {
  margin: 12px;
  border-left: 6px solid orange;
  padding-left: 10px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  padding: 10px;
}

.tile {
  background: #1c1c1c;
  padding: 14px;
  text-align: center;
  border-radius: 6px;
  cursor: pointer;
  outline: none;
}

.tile:focus {
  border: 3px solid orange;
}

video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  z-index: 999;
}
</style>
</head>

<body>

<h2>Tamil Channels</h2>
<div id="tamil" class="grid"></div>

<h2>Hindi Channels</h2>
<div id="hindi" class="grid"></div>

<h2>English Channels</h2>
<div id="english" class="grid"></div>

<div id="status" style="padding:12px">Loading channels…</div>

<video id="video" controls></video>

<script>
const CHANNELS_URL = "https://iptv-org.github.io/api/channels.json";
const STREAMS_URL  = "https://iptv-org.github.io/api/streams.json";

const tamilKeywords = [
  "sun", "vijay", "k tv", "zee tamil", "polimer",
  "kalaignar", "raj", "jaya", "thanthi",
  "news7 tamil", "puthiya thalaimurai",
  "colors tamil", "chutti"
];

const hindiKeywords = [
  "zee", "sony", "sab", "star",
  "colors", "aaj tak", "ndtv",
  "dd national", "dd news",
  "mtv", "india tv"
];

const englishKeywords = [
  "cnn", "bbc", "discovery",
  "national geographic", "nat geo",
  "hbo", "movies now",
  "cnbc", "bloomberg",
  "star world", "india today"
];

const video = document.getElementById("video");
let hls;

/* Load data */
Promise.all([
  fetch(CHANNELS_URL).then(r => r.json()),
  fetch(STREAMS_URL).then(r => r.json())
]).then(([channels, streams]) => init(channels, streams));

function init(channels, streams) {
  const status = document.getElementById("status");

  /* Build channelId → HLS stream map */
  const streamMap = {};
  streams.forEach(s => {
    if (
      s.channel &&
      s.url &&
      s.url.includes(".m3u8") &&
      !streamMap[s.channel]
    ) {
      streamMap[s.channel] = s.url;
    }
  });

  let shown = 0;

  channels.forEach(c => {
    if (c.country !== "IN") return;
    const streamUrl = streamMap[c.id];
    if (!streamUrl) return;

    const name = c.name.toLowerCase();
    const tile = createTile(c.name, streamUrl);

    if (tamilKeywords.some(k => name.includes(k))) {
      document.getElementById("tamil").appendChild(tile);
      shown++;
    }
    else if (hindiKeywords.some(k => name.includes(k))) {
      document.getElementById("hindi").appendChild(tile);
      shown++;
    }
    else if (englishKeywords.some(k => name.includes(k))) {
      document.getElementById("english").appendChild(tile);
      shown++;
    }
  });

  status.textContent = "Playable channels loaded: " + shown;

  const first = document.querySelector(".tile");
  if (first) first.focus();
}

function createTile(name, url) {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.tabIndex = 0;
  tile.textContent = name;

  tile.onclick = () => play(url);
  tile.onkeydown = e => {
    if (e.key === "Enter") play(url);
  };

  return tile;
}

function play(url) {
  video.style.display = "block";

  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }

  video.play();
  video.requestFullscreen?.();
}

/* Exit video with Back / Esc */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" || e.key === "Backspace") {
    video.pause();
    video.style.display = "none";
    document.exitFullscreen?.();
  }
});
</script>

</body>
</html>
